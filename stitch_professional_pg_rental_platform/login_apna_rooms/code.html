<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }

            background-color: #F8FAFC;
        }

<body class="min-h-screen flex flex-col font-body-md text-text-primary antialiased">
<!-- Header / Branding Anchor (Suppressing full Nav per Destination Rule) -->
<header class="sticky top-0 w-full z-50 bg-surface-main border-b border-border-low">
<div class="flex justify-between items-center max-w-max-width mx-auto px-margin-mobile md:px-margin-desktop h-16">
<div class="text-headline-md font-headline-md font-bold text-primary">Apna Rooms</div>
<a class="text-primary font-body-md hover:underline" href="#">Back to site</a>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-margin-mobile py-xl">
<!-- Auth Card -->
<div class="w-full max-w-[440px] bg-surface-main border border-border-low p-xl shadow-sm rounded-lg">
<div class="mb-xl text-center">
<h1 class="font-headline-lg text-headline-lg mb-xs">Welcome Back</h1>
<p class="font-body-md text-text-secondary">Enter your credentials to access your account</p>
</div>
<form class="space-y-lg" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-sm">
<label class="font-label-md text-label-md uppercase tracking-wider text-text-secondary" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full h-10 pl-10 pr-md bg-surface-subtle border border-border-low rounded text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md uppercase tracking-wider text-text-secondary" for="password">Password</label>
<a class="text-body-sm text-primary hover:underline font-medium" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-10 pl-10 pr-md bg-surface-subtle border border-border-low rounded text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center space-x-sm">
<input class="w-4 h-4 rounded border-border-low text-primary focus:ring-primary" id="remember" type="checkbox"/>
<label class="font-body-md text-text-secondary select-none" for="remember">Remember me for 30 days</label>
</div>
<!-- Login CTA -->
<button class="w-full h-10 bg-primary-container text-on-primary font-body-md font-semibold rounded hover:opacity-90 active:opacity-80 transition-all shadow-sm" type="submit">
                    Login
                </button>
<!-- Divider -->
<div class="relative py-md">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t border-border-low"></div></div>
<div class="relative flex justify-center"><span class="bg-surface-main px-md font-label-sm text-label-sm text-outline uppercase tracking-widest">or continue with</span></div>
</div>
<!-- Social Login -->
<button class="w-full h-10 bg-surface-main border border-border-low text-text-primary font-body-md font-medium rounded flex items-center justify-center gap-sm hover:bg-surface-subtle transition-all" type="button">
<img alt="Google Logo" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCrA3ZdWw4RZRqmDjYU8PQgv7xRSoR7CwfjJy0FMx8qdKi_HIe4zT7xBCrvxiHL99k3Fz8dO-WqPzoVmHiwi5Yqib8MPcksd3d1mxiZxbnhJgzdrR4AiWNsGaalu9n573d7IEC1rp98BPzCDFJN9hp0Bmi8Qh9y8Dxo_XcWuNOg0tpu4bglGQLDBjHL0EQiYkBItDRn5YerW-2pYL7v9ih3Usxw8HWK4wyt-TsPX_tfbXgAHV3LbGdMn2eM7ivub3ndPZIsBTt-ZWKt"/>
                    Continue with Google
                </button>
</form>
<div class="mt-xl text-center">
<p class="font-body-md text-text-secondary">
                    Don't have an account? 
                    <a class="text-primary font-semibold hover:underline" href="#">Signup for free</a>
</p>
</div>

</main>
<!-- Simplified Footer -->
<footer class="w-full bg-surface-subtle border-t border-border-low py-lg mt-auto">
<div class="max-w-max-width mx-auto px-margin-mobile md:px-margin-desktop flex flex-col md:flex-row justify-between items-center gap-md">

<div class="flex gap-lg">

<a class="font-body-sm text-text-secondary hover:text-primary transition-colors" href="#">Terms</a>
<a class="font-body-sm text-text-secondary hover:text-primary transition-colors" href="#">Privacy</a>
</div>
</div>
</footer>
<script>
        // Simple micro-interaction for password visibility or focus states
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined')?.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined')?.classList.remove('text-primary');
            });
        });
    </script>
