<style>
        body {
            background-color: #0b1326;
            color: #dae2fd;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card {
            background-color: #171f33;
            border: 1px solid #2d3449;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }
        .input-field {
            background-color: #1e293b;
            border-bottom: 1px solid #464554;
            transition: all 0.2s ease-in-out;
        }
        .input-field:focus {
            outline: 2px solid #8083ff;
            border-bottom-color: transparent;
        }
        .btn-primary {
            background: linear-gradient(135deg, #8083ff 0%, #494bd6 100%);
        }
        .glass-overlay {
            background: radial-gradient(circle at top right, rgba(128, 131, 255, 0.05), transparent);
        }

<body class="font-body-md text-body-md min-h-screen flex flex-col">
<!-- Auth Layout Wrapper -->
<main class="flex-grow flex items-center justify-center relative overflow-hidden py-12 px-margin-mobile md:px-margin-desktop">
<!-- Atmospheric Background Element -->
<div class="absolute top-0 right-0 w-full h-full glass-overlay pointer-events-none"></div>
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary opacity-5 blur-[120px] rounded-full"></div>
<div class="w-full max-w-[440px] z-10">
<!-- Brand Identity -->
<div class="flex justify-center mb-10">
<img alt="Apna Rooms Logo" class="h-12 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBSBJZgtDnDe233fQ5a3lxfGGT5RYFnhJBQy0El_4ZF5vC_YPkEOP9wYRkWFcwvmmxGUxPyvtl5gaw2ZsiU3ruUMy6CbL2jo9errGu6_cAsZcijKxLUhzAQV01nBELK2PoSt_deroN4zsfemaWmyKSPfG5dI6CZG7DPNCNq9Z5JT001g9JMiidE_unLc85rFZAQr5UqhWWjm0KgunMIAjBvBEtIlUlalM5smeiNQ0woQfiCR_tRKheYUc66-vc_Yctvuxm18GCZm1aH"/>
</div>
<!-- Login Container -->
<div class="login-card rounded-xl p-8 md:p-10">
<header class="mb-8">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Welcome Back</h1>
<p class="text-on-surface-variant font-body-sm">Enter your credentials to access your premium housing dashboard.</p>
</header>
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px] transition-colors group-focus-within:text-primary">mail</span>
<input class="input-field w-full pl-10 pr-4 py-3 text-on-surface placeholder-outline-variant focus:ring-0 rounded-lg" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="text-primary font-body-sm hover:underline transition-all" href="#">Forgot password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px] transition-colors group-focus-within:text-primary">lock</span>
<input class="input-field w-full pl-10 pr-12 py-3 text-on-surface placeholder-outline-variant focus:ring-0 rounded-lg" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="w-4 h-4 rounded border-outline-variant bg-surface-container-low text-primary focus:ring-primary focus:ring-offset-surface-dim" id="remember" name="remember" type="checkbox"/>
<label class="ml-2 text-on-surface-variant font-body-sm cursor-pointer select-none" for="remember">Remember me for 30 days</label>
</div>
<!-- Submit Button -->
<button class="btn-primary w-full py-3.5 px-4 rounded-xl text-white font-semibold flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-label-caps uppercase bg-surface-container px-4 text-on-surface-variant">
                        Or continue with
                    </div>
</div>
<!-- Social Login -->
<button class="w-full border border-outline-variant hover:bg-surface-container-highest transition-colors flex items-center justify-center gap-3 py-3 rounded-xl font-medium text-on-surface" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Google
                </button>
<!-- Signup Link -->
<p class="mt-8 text-center text-on-surface-variant font-body-sm">
                    Don't have an account? 
                    <a class="text-primary font-semibold hover:underline" href="#">Create an account</a>
</p>
</div>
<!-- Footer Meta -->
<footer class="mt-8 text-center">
<p class="text-outline text-label-caps uppercase tracking-widest opacity-60">© 2024 Apna Rooms • Precision Living System</p>
</footer>
</div>
</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerText = 'visibility';
            }
        }

        // Simple animation on load
        window.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.login-card');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                card.style.transition = 'all 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body></html>
